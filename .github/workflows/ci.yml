name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # gradle.properties pins the JDK path of the development machine.
      # The runner brings its own, so drop the line rather than hard-code a second path.
      - name: Use the runner's JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      # The icon set and the sky palettes are drawn, not written; the mapping tests cannot see a
      # vector that lost a path. Record a new golden deliberately with :app:recordRoborazziDebug.
      - name: Screenshot goldens
        run: ./gradlew :app:verifyRoborazziDebug --console=plain

      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ApexWeather-debug
          path: app/build/outputs/apk/debug/ApexWeather-debug.apk

  # Kept as its own job so a slow emulator never delays the unit-test feedback above.
  instrumented:
    name: Device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Use the runner's JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # KVM is present on the standard Ubuntu runner but not readable by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 31 is the app's minSdk, so this is the oldest platform it claims to run on.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain

      - name: Upload device test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: warn

  # The instrumented suite runs against the debug build, which is not what anyone installs. This runs
  # the release APK — R8 on — because Glance resolves its layouts, kotlinx-serialization its
  # serializers and Hilt its graph at runtime, and a missing keep rule shows up nowhere else.
  release-smoke:
    name: Release APK on a device
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Use the runner's JDK
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --console=plain

      # A newer API than the instrumented job: between them the release build is seen on the oldest
      # platform this app supports and on a current one.
      - name: Smoke the release build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./tools/release-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke
          path: build/release-smoke
          if-no-files-found: warn
